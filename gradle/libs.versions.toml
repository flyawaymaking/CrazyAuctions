[plugins]
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[versions]
# Paper API
paper = "1.21.10-R0.1-SNAPSHOT"
minecraft = "1.21.10"

# Gradle Plugins
runPaper = "3.0.2"
shadow = "9.2.2"

# Bukkit Plugins
headdatabaseapi = "1.3.1"
placeholderapi = "2.11.7"
oraxen = "1.194.1"
vault = "1.7.1"
coinsengine = "2.6.0"

# Vital API
vital-paper = "1.0.6"

[libraries]
# Paper API
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

# Bukkit Plugins API
headdatabaseapi = { module = "com.arcaniax:HeadDatabase-API", version.ref = "headdatabaseapi" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
vault = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
coinsengine = { module = "su.nightexpress.coinsengine:CoinsEngine", version.ref = "coinsengine" }
oraxen = { module = "io.th0rgal:oraxen", version.ref = "oraxen" }

# Vital API
vital-paper = { module = "com.ryderbelserion.vital:paper", version.ref = "vital-paper" }

[bundles]
# Shared with the git submodules
shared = ["headdatabaseapi", "placeholderapi", "oraxen", "vault", "coinsengine"]
